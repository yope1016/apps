<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小さな便利ツール集</title>
<meta name="description" content="毎日ひとつずつ増える、無料の小さな便利ツール集。登録不要・入力内容は送信されません。">
<style>
body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f6f5f2;color:#1d1d1f}
header{padding:48px 20px 24px;max-width:960px;margin:auto}
h1{font-size:28px;margin:0 0 8px}p.lead{color:#555;margin:0}
main{max-width:960px;margin:auto;padding:0 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
a.card{display:block;background:#fff;border-radius:14px;padding:20px;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .15s}
a.card:hover{transform:translateY(-2px)}
.card h2{font-size:18px;margin:0 0 6px}.card p{font-size:14px;color:#666;margin:0}
.date{font-size:12px;color:#999;margin-top:10px}
footer{text-align:center;font-size:12px;color:#999;padding:24px}
</style></head><body>
<header><h1>小さな便利ツール集</h1><p class="lead">毎日ひとつずつ増える、無料ツール。登録不要で、入力した内容はどこにも送信されません。</p></header>
<main id="list"></main>
<footer>© 小さな便利ツール集</footer>
<script>
fetch('apps.json').then(r=>r.json()).then(apps=>{
  const el=document.getElementById('list');
  apps.filter(a=>a.status!=='終了').sort((a,b)=>b.date.localeCompare(a.date)).forEach(a=>{
    const c=document.createElement('a');c.className='card';c.href=a.slug+'/';
    const h=document.createElement('h2');h.textContent=a.title;
    const p=document.createElement('p');p.textContent=a.summary||'';
    const d=document.createElement('div');d.className='date';d.textContent=a.date;
    c.append(h,p,d);el.append(c);
  });
});
</script><!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "807f8f4e9a5e4ff099a62c90f8891041"}'></script><!-- End Cloudflare Web Analytics -->
</body></html>
